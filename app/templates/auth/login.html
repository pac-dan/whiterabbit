{% extends 'workflow_base.html' %}
{% block page_title %}Studio sign in — Momentum Clips{% endblock %}
{% block workflow %}<p class="ap-eyebrow">MOMENTUM / STUDIO ACCESS</p><h1>Welcome back.</h1><form method="post" class="workflow-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" required autocomplete="username" maxlength="120"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><label class="check"><input type="checkbox" name="remember">Remember me on this device</label><button class="exp-button" type="submit">Sign in ↗</button><a class="ap-text-link" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></form><p>Studio access is for administrators. No account is needed to book a session.</p>{% endblock %}
