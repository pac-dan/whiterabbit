{% extends 'workflow_base.html' %}
{% block page_title %}Sign your session waiver — Momentum Clips{% endblock %}
{% block workflow %}<p class="ap-eyebrow">MOMENTUM / SESSION WAIVER</p><h1>Before you ride.</h1><p>Session {{ booking.id }} · {{ booking.booking_date|datetime }}</p><section class="workflow-panel"><h2>Liability waiver</h2><div class="waiver-copy">{{ waiver_text }}</div></section><form method="post" action="{{ url_for('main.waiver_submit', token=token) }}" class="workflow-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your full legal name (electronic signature)<input name="legal_name" required minlength="3" maxlength="100" autocomplete="name"></label><label class="check"><input type="checkbox" name="agreement" required>I have read and agree to the waiver above. Typing my name is my electronic signature.</label><button class="exp-button">Sign waiver ↗</button></form>{% endblock %}
