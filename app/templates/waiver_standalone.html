{% extends 'workflow_base.html' %}
{% block page_title %}Sign a waiver — Momentum Clips{% endblock %}
{% block workflow %}<p class="ap-eyebrow">MOMENTUM / BEFORE YOUR SESSION</p><h1>Your mountain waiver.</h1><section class="workflow-panel"><h2>Liability waiver</h2><div class="waiver-copy">{{ waiver_text }}</div></section><form method="post" class="workflow-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="client_name" required maxlength="100" autocomplete="name"></label><label>Email<input name="client_email" type="email" required maxlength="200" autocomplete="email"></label><label>Full legal name (electronic signature)<input name="legal_name" required minlength="3" maxlength="100"></label><label class="check"><input type="checkbox" name="agreement" required>I have read and accept the waiver above. Typing my legal name is my electronic signature.</label><button class="exp-button">Sign waiver ↗</button></form>{% endblock %}
