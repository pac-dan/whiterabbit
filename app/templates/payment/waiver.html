{% extends 'workflow_base.html' %}
{% block page_title %}Your waiver — Momentum Clips{% endblock %}
{% block workflow %}<p class="ap-eyebrow">01 / PAYMENT VERIFIED · 02 / WAIVER</p><h1>Ready for your session.</h1><p>{{ pkg.name }} · €{{ '%.2f'|format(pkg.price / 100) }}</p><article class="workflow-panel"><h2>Liability waiver</h2><div class="waiver-copy">{{ waiver_text }}</div></article><form method="post" class="workflow-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input name="email" type="email" required maxlength="200" autocomplete="email" value="{{ request.form.get('email','') }}"></label><label>Your full legal name<input name="legal_name_typed" required minlength="3" maxlength="100" autocomplete="name" value="{{ request.form.get('legal_name_typed','') }}"></label><label class="check"><input type="checkbox" name="agree_to_terms" required>I have read and agree to the liability waiver above. Typing my name is my electronic signature.</label><button class="exp-button" type="submit">Sign waiver & continue ↗</button></form>{% endblock %}
